name: Deploy

on:
  push:
    branches:
      - main      # main 브랜치 = Prod 배포
      - dev       # dev 브랜치 = Dev 배포

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 환경 변수 설정 (브랜치에 따라 dev/prod 구분)
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "ECR_REPO_NAME=hospital-erp-prod" >> $GITHUB_ENV
            echo "ECS_CLUSTER=hospital-erp-prod-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=hospital-erp-prod-service" >> $GITHUB_ENV
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "ECR_REPO_NAME=hospital-erp-dev" >> $GITHUB_ENV
            echo "ECS_CLUSTER=hospital-erp-dev-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=hospital-erp-dev-service" >> $GITHUB_ENV
          fi

      # 2. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 3. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 최신 태그(latest)와 커밋 해시 태그 2개를 동시에 푸시
          docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:latest .
          docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG

      # 5. ECS 서비스 강제 업데이트 (재배포)
      - name: Force New Deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
