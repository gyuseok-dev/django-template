[project]
name = "django-template"
version = "0.1.0"
description = "Django REST API template project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django==5.0.2",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.3.1",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "gunicorn==21.2.0",
    "whitenoise==6.9.0",
    "playwright>=1.57.0",
    "pytest-playwright>=0.7.2",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.8",
    "mypy>=1.19.1",
    "ruff>=0.14.7",
    "types-python-dateutil>=2.9.0.20251115",
    "pytest",
    "pytest-playwright",
    "pre-commit>=4.0.0",
]

[tool.uv]
dev-dependencies = []
package = false
