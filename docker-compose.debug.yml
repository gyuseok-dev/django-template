# 디버그 모드로 실행하려면:
# docker compose -f docker-compose.yml -f docker-compose.debug.yml up

services:
  web:
    command: bash -c "uv pip install --system debugpy && python manage.py migrate && python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy 포트
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
