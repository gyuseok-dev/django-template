<div class="p-6">
    <!-- Calendar Header -->
    <div class="flex items-center justify-between mb-6">
        <button id="prevMonth" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <h2 id="currentMonth" class="text-xl font-semibold dark:text-white"></h2>
        <button id="nextMonth" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
    </div>

    <!-- Calendar Grid -->
    <!-- Day Headers -->
    <div class="grid grid-cols-7 gap-2 mb-2">
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">일</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">월</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">화</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">수</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">목</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">금</div>
        <div class="text-center font-semibold py-2 text-gray-600 dark:text-gray-400">토</div>
    </div>

    <!-- Calendar Days -->
    <div id="calendarDays" class="grid grid-cols-7 gap-2"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 서버에서 전달받은 일별 매출 데이터
        const dailyRevenueData = {{ daily_revenue_data|safe }};
        const currentYear = {{ current_year }};
        const currentMonth = {{ current_month_number }};

        let currentDate = new Date(currentYear, currentMonth - 1, 1);

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month/year display
            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            document.getElementById('currentMonth').textContent = `${year}년 ${monthNames[month]}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // 현재 표시중인 달이 데이터가 있는 달인지 확인
            const isCurrentDataMonth = year === currentYear && month === currentMonth - 1;

            // Clear previous days
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            // Add empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'text-center py-3';
                calendarDays.appendChild(emptyDay);
            }

            // Add days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                const isToday = today.getDate() === day &&
                               today.getMonth() === month &&
                               today.getFullYear() === year;
                const isSunday = (firstDay + day - 1) % 7 === 0;
                const isSaturday = (firstDay + day - 1) % 7 === 6;

                // 매출 데이터가 있는지 확인
                const hasRevenue = isCurrentDataMonth && dailyRevenueData[day];

                let bgClass = 'hover:bg-gray-100 dark:hover:bg-gray-700';
                if (isToday) {
                    bgClass = 'bg-blue-500 text-white font-bold';
                } else if (hasRevenue) {
                    bgClass = 'bg-green-50 dark:bg-green-900/20 hover:bg-green-100 dark:hover:bg-green-900/30';
                }

                let textColorClass = 'dark:text-white';
                if (isToday) {
                    textColorClass = 'text-white';
                } else if (isSunday) {
                    textColorClass = 'text-red-500';
                } else if (isSaturday) {
                    textColorClass = 'text-blue-500';
                }

                dayElement.className = `p-3 rounded-lg cursor-pointer transition-colors ${bgClass} ${textColorClass}`;

                // 날짜와 매출 정보 표시
                const revenue = hasRevenue ? dailyRevenueData[day] : { revenue: 0, patient_count: 0 };

                dayElement.innerHTML = `
                    <div class="font-bold mb-2 text-base">${day}</div>
                    <div class="text-xs leading-relaxed text-left space-y-0.5">
                        <div class="text-gray-700 dark:text-gray-300">인원: 45명</div>
                        <div class="text-blue-600 dark:text-blue-400">건진: 144,617원</div>
                        <div class="text-green-600 dark:text-green-400">매출: 15,895,289원</div>
                        <div class="border-t border-gray-300 dark:border-gray-600 my-1"></div>
                        <div class="text-purple-600 dark:text-purple-400">신환: 14명</div>
                        <div class="text-orange-600 dark:text-orange-400">90초: 3명</div>
                        <div class="text-teal-600 dark:text-teal-400">재진: 89명</div>
                        <div class="text-gray-500 dark:text-gray-400">산정X: 8명</div>
                    </div>
                `;

                calendarDays.appendChild(dayElement);
            }
        }

        // Navigation buttons
        document.getElementById('prevMonth').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Initial render
        renderCalendar();
    });
</script>
