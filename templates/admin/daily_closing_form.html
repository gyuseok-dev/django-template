{% extends "admin/base_site.html" %}
{% load i18n static unfold crispy_forms_tags %}

{% block content %}
<div class="p-10 max-w-screen-2xl mx-auto">
    <div class="mb-6">
        <h1 class="text-3xl font-bold">{{ title }}</h1>
        <p class="text-gray-600 mt-2">{{ view.get_today_date }}</p>
    </div>

    <div class="bg-white shadow-sm rounded-lg p-6">
        {% crispy form "unfold_crispy" %}
    </div>
</div>

<style>
    /* 폼 스타일링 */
    .form-row {
        margin-bottom: 1rem;
    }

    fieldset {
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    fieldset legend {
        font-weight: 600;
        font-size: 1.1rem;
        color: #374151;
        padding: 0 0.5rem;
    }

    .btn {
        padding: 0.5rem 1.5rem;
        border-radius: 0.375rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background-color: #3955B4;
        color: white;
    }

    .btn-primary:hover {
        background-color: #2d4490;
    }

    .btn-secondary {
        background-color: #6b7280;
        color: white;
    }

    .btn-secondary:hover {
        background-color: #4b5563;
    }

    .ms-2 {
        margin-left: 0.5rem;
    }
</style>
{% endblock %}
